<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinShop - Catálogo</title>

    <link rel="stylesheet" href="../Diseño/productos.css">
</head>

<body>

<nav class="navbar">
    <div class="nav-container">
        <div class="logo">Win<span>Shop</span></div>

        <div class="menu-toggle" id="menu-toggle">☰</div>

        <ul class="nav-links" id="nav-links">
            <li id="nav-login"><a href="Login.html">Iniciar sesión</a></li>
            <li id="nav-user" style="display:none"><a href="#"></a></li>
            <li><a href="Index.html">Inicio</a></li>
            <li id="nav-productos"><a href="productos.html">Productos</a></li>
            <li id="nav-register"><a href="Registro.html">Registrarse</a></li>
            <li id="nav-support" style="display:none"><a href="contacto.html">Soporte</a></li>

            <li id="nav-cart" style="display: none;">
                <a href="carrito.html" class="cart-badge">🛒 <span id="cart-count">0</span></a>
            </li>

            <li id="nav-panelAdmin" style="display:none"><a href="panelAdmin.html">Administración</a></li>
            <li id="nav-panel" style="display:none"><a href="panelVendedor.html">Ventas</a></li>
            <li id="nav-logout" style="display: none;"><a href="#">Cerrar sesión</a></li>
        </ul>
    </div>
</nav>


<header class="header">
    <h1>Catálogo de Productos</h1>
    <p>Encuentra lo que buscas con facilidad</p>

    <div class="buscador">
        <input type="text" id="searchInput" placeholder="Buscar productos...">
        <button id="searchButton">Buscar</button>
    </div>
</header>

<section class="categorias-section">
    <h2>Explorar por categorías</h2>
    <div class="categorias-container">
        <a href="#" class="categoria-item" data-categoria="gaming">
            <div class="categoria-icono">Gaming 🎮</div>
        </a>
        <a href="#" class="categoria-item" data-categoria="celulares">
            <div class="categoria-icono">Celulares 📱</div>
        </a>
        <a href="#" class="categoria-item" data-categoria="electronica">
            <div class="categoria-icono">electronica 💻</div>
        </a>
        <a href="#" class="categoria-item" data-categoria="audio">
            <div class="categoria-icono">Audio 🎧</div>
        </a>
        <a href="#" class="categoria-item" data-categoria="moda">
            <div class="categoria-icono">Moda 👕</div>
        </a>
        <a href="#" class="categoria-item" data-categoria="hogar">
            <div class="categoria-icono">Hogar 🏠</div>
        </a>
    </div>
</section>


<section id="productos">
    <div class="productos-container" id="contenedor-productos">
        <!-- Los productos publicados por vendedores/admin se inyectan aquí desde la DB -->
    </div>
</section>

<!-- MODAL VER DESCRIPCIÓN COMPLETA -->
<div id="modal-descripcion" class="modal-overlay">
    <div class="modal-box">
        <h3 id="modal-descripcion-titulo"></h3>
        <p id="modal-descripcion-texto"></p>

        <div class="modal-botones">
            <button class="btn-modal-cancelar" onclick="document.getElementById('modal-descripcion').style.display='none'">Cerrar</button>
        </div>
    </div>
</div>

<script src="../Funcionalidad/menuHambuguesa.js"></script>
<script src="../Funcionalidad/authentication.js"></script>
<script src="../Funcionalidad/navbar.js"></script>
<script src="../Funcionalidad/productosPrincipal.js"></script>
<script src="../Funcionalidad/carrito.js"></script>

</body>
</html>
